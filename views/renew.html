<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브리픽 재구독</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--fg:#0d0d0d;--fg2:#333;--mut:#666;--mut2:#999;--placeholder:#999;
  --border:rgba(0,0,0,0.05);--border-md:rgba(0,0,0,0.08);
  --acc:#18E299;--acc-light:#d4fae8;--acc-deep:#0fa76e;--err:#c83232;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fafafa;color:var(--fg2);font:15px/1.5 Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;outline:none}

.back-home{
  display:inline-flex;align-items:center;padding:14px 20px;color:var(--mut);font-size:14px;
}
.back-home:hover{color:var(--acc-deep)}

.wrap{min-height:calc(100vh - 48px);display:flex;align-items:flex-start;justify-content:center;padding:20px 20px 60px}
.card{
  background:var(--panel);border-radius:20px;padding:32px 28px 28px;width:100%;max-width:440px;
  box-shadow:0 8px 28px rgba(0,0,0,0.06);position:relative;
}
.card .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.card .brand span{font:700 18px/1 Pretendard,sans-serif;color:var(--fg);letter-spacing:-0.3px}
.card h1{font:600 22px/1.3 Pretendard,sans-serif;color:var(--fg);margin-bottom:6px;letter-spacing:-0.44px}
.card .sub{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:18px}
.extend-note{display:inline-block;margin-top:4px;font-size:12px;color:var(--err);font-weight:500}

.test-banner{
  margin:0 0 14px;padding:8px 12px;border-radius:8px;
  background:#fde8e8;color:var(--err);border:1px solid #f7c6c6;
  font:500 12px/1.5 Pretendard,sans-serif;text-align:center;letter-spacing:-0.1px;
}

/* ── 가격 플랜 선택 ── */
.plans{
  display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 18px;
}
.plan{
  position:relative;display:block;cursor:pointer;
  padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;
  background:#fafafa;transition:border-color .15s ease, background .15s ease;
}
.plan:hover{border-color:var(--border-md)}
.plan.selected{
  border-color:var(--fg);background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.plan input[type="radio"]{position:absolute;opacity:0;pointer-events:none}
.plan.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.plan.disabled:hover{border-color:var(--border)}
.plan-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plan-period{font:600 15px/1.2 Pretendard,sans-serif;color:var(--fg);letter-spacing:-0.3px}
.plan-prices{display:flex;align-items:baseline;gap:6px}
.plan-price-orig{font:500 13px/1.2 Pretendard,sans-serif;color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.plan-price-now{font:700 17px/1.2 Pretendard,sans-serif;color:var(--fg);letter-spacing:-0.3px}
.plan-meta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:6px;font:500 12px/1.3 Pretendard,sans-serif;color:var(--mut);
}
.plan-badge{
  display:inline-block;padding:3px 7px;border-radius:5px;
  font:600 11px/1 Pretendard,sans-serif;letter-spacing:0.2px;
  background:#fff4d6;color:#8a5400;
}
.plan-badge.primary{background:var(--fg);color:#fff}

.field{margin-bottom:14px}
.field label{display:block;font:500 13px/1.4 Pretendard,sans-serif;color:var(--fg2);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;background:var(--bg);
  border:1.5px solid var(--border-md);border-radius:10px;
  font:400 15px/1.4 Pretendard,sans-serif;color:var(--fg);transition:border-color .2s;
}
.field input:focus{border-color:var(--acc)}
.field input:disabled{
  background:#f0f0f0;color:var(--mut2);border-color:var(--border);
  cursor:not-allowed;
}

.consent{
  display:flex;align-items:flex-start;gap:10px;padding:14px;
  background:var(--acc-light);border-radius:10px;margin:16px 0 20px;
  font-size:13px;color:var(--fg2);line-height:1.5;
}
.consent input[type="checkbox"]{margin-top:2px;accent-color:var(--acc-deep);flex-shrink:0}
.honeypot{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.confirm-box{
  display:none;margin:16px 0;padding:20px;border-radius:12px;
  background:var(--acc-light);text-align:center;
}
.confirm-box.show{display:block}
.confirm-box .confirm-label{display:block;font:500 12px/1.3 Pretendard,sans-serif;color:var(--acc-deep);letter-spacing:0.4px;text-transform:uppercase}
.confirm-box .confirm-num{display:block;margin:6px 0;font:600 26px/1.2 Pretendard,sans-serif;color:var(--fg);letter-spacing:-0.5px}
.confirm-box .confirm-note{display:block;font:500 13px/1.5 Pretendard,sans-serif;color:var(--fg2)}
.confirm-ext{display:flex;flex-direction:column;gap:4px;max-width:240px;margin:6px auto 0}
.confirm-ext > div{display:flex;justify-content:space-between;font:500 13px/1.5 Pretendard,sans-serif;color:var(--fg2)}
.confirm-ext > div > b{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}

.submit-btn{
  width:100%;padding:14px;background:var(--fg);color:#fff;border-radius:10px;
  font:500 15px/1 Pretendard,sans-serif;transition:background .2s;
}
.submit-btn:hover{background:#000}
.submit-btn:disabled{background:var(--placeholder);cursor:not-allowed}
.cancel-btn{
  width:100%;padding:12px;margin-top:8px;background:transparent;color:var(--mut);
  border:1px solid var(--border-md);border-radius:10px;
  font:500 14px/1 Pretendard,sans-serif;display:none;transition:all .2s;
}
.cancel-btn.show{display:block}
.cancel-btn:hover{background:var(--border-md);color:var(--fg)}

.status{margin-top:14px;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.status.show{display:block}
.status.success{background:#fff4e5;color:#a35a00}
.status.success .until-date{display:inline-block;margin-top:4px;font-size:13px;font-weight:500;opacity:0.85}
.status.error{background:#fde8e8;color:var(--err)}
.status.info{background:#fff4e5;color:#a35a00}

.success-actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.kakao-link{
  display:block;padding:12px;background:#FEE500;color:#3c1e1e;
  border-radius:10px;font:500 14px/1 Pretendard,sans-serif;text-align:center;transition:transform .15s;
}
.kakao-link:hover{transform:translateY(-1px)}
.kakao-link.emphasis{font-size:15px;font-weight:600;padding:15px;box-shadow:0 4px 12px rgba(254,229,0,0.45)}

.complete-notice{
  display:none;padding:18px;border-radius:12px;
  background:var(--acc-light);color:var(--acc-deep);border:2px solid var(--acc);
  font:600 14px/1.6 Pretendard,sans-serif;text-align:center;letter-spacing:-0.1px;
  animation:pulseNotice 2s ease-in-out infinite;
}
.complete-notice.show{display:block}
.complete-notice .notice-head{display:block;font-size:16px;color:#0a7a50;margin-bottom:6px}
.complete-notice .notice-sub{display:block;font-weight:500;font-size:13px;color:var(--acc-deep);margin-top:6px}
@keyframes pulseNotice{0%,100%{box-shadow:0 0 0 0 rgba(24,226,153,0.45)}50%{box-shadow:0 0 0 10px rgba(24,226,153,0)}}

/* 결제 처리 중 / 완료 — 폼·plan·폰·동의 박스 모두 숨겨 깔끔하게 */
.card.completed .test-banner,
.card.completed > .sub,
.card.completed .plans,
.card.completed .field,
.card.completed .consent,
.card.completed .honeypot,
.card.completed .confirm-box,
.card.completed #subSubmit,
.card.completed #subCancel,
.card.processing .test-banner,
.card.processing > .sub,
.card.processing .plans,
.card.processing .field,
.card.processing .consent,
.card.processing .honeypot,
.card.processing .confirm-box,
.card.processing #subSubmit,
.card.processing #subCancel{display:none !important}

.card.completed .status{margin-top:8px;padding:16px;font-size:15px;font-weight:500;border-radius:12px;text-align:center}
.card.processing .status{
  margin:24px 0;padding:32px 18px;font-size:15px;font-weight:500;
  border-radius:12px;text-align:center;min-height:80px;
  display:flex !important;align-items:center;justify-content:center;
}
.card.completed .success-actions{margin-top:14px}
.card.completed .kakao-link{padding:18px 16px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<a class="back-home" href="/">← 브리픽 홈</a>

<main class="wrap">
  <div class="card" id="card">
    <div class="brand">
      <img src="/assets/briefick_profile_640.jpeg" alt="">
      <span>브리픽</span>
    </div>
    <h1>재구독</h1>
    <div class="test-banner">본 결제는 테스트용으로, 실제로는 결제되지 않습니다.</div>
    <p class="sub">매일 아침 8시, 최신 경제 뉴스를 카카오톡으로 받아보세요.<br><span class="extend-note">이미 구독 중이신 분들은 기간이 연장됩니다.</span></p>

    <form id="subscribeForm" novalidate autocomplete="off">
      <div class="plans" role="radiogroup" aria-label="구독 기간 선택">
        <label class="plan" data-plan="1m">
          <input type="radio" name="plan" value="1m" checked>
          <div class="plan-row">
            <span class="plan-period">1개월</span>
            <span class="plan-prices">
              <span class="plan-price-now">100원</span>
            </span>
          </div>
          <div class="plan-meta">
            <span>월 100원</span>
            <span></span>
          </div>
        </label>
        <label class="plan disabled" data-plan="6m" aria-disabled="true">
          <input type="radio" name="plan" value="6m" disabled>
          <div class="plan-row">
            <span class="plan-period">6개월</span>
            <span class="plan-prices">
              <span class="plan-price-orig">17,400원</span>
              <span class="plan-price-now">13,800원</span>
            </span>
          </div>
          <div class="plan-meta">
            <span>월 2,300원</span>
            <span class="plan-badge">준비 중</span>
          </div>
        </label>
        <label class="plan disabled" data-plan="12m" aria-disabled="true">
          <input type="radio" name="plan" value="12m" disabled>
          <div class="plan-row">
            <span class="plan-period">12개월</span>
            <span class="plan-prices">
              <span class="plan-price-orig">34,800원</span>
              <span class="plan-price-now">22,800원</span>
            </span>
          </div>
          <div class="plan-meta">
            <span>월 1,900원</span>
            <span class="plan-badge">준비 중</span>
          </div>
        </label>
      </div>

      <div class="field">
        <label for="subPhone">전화번호 (하이픈 없이)</label>
        <input id="subPhone" name="phone" type="tel" inputmode="numeric" pattern="01[016789][0-9]{7,8}" maxlength="11" placeholder="01012345678" required>
      </div>
      <input class="honeypot" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent">
        <input id="subConsent" type="checkbox" required>
        <span>카카오 친구톡을 통한 <b>광고성 정보 수신</b>에 동의합니다. 매일 오전 8시 발송되며, 언제든지 해지 요청으로 수신을 중단할 수 있습니다.</span>
      </label>
      <div class="confirm-box" id="subConfirm"></div>
      <button class="submit-btn" id="subSubmit" type="submit">2,900원 결제하기</button>
      <button class="cancel-btn" id="subCancel" type="button">취소</button>
      <div class="status" id="subStatus"></div>
      <div class="success-actions" id="subSuccess">
        <div class="complete-notice" id="subCompleteNotice">
          <span class="notice-head">⚠ 카카오 채널 친구 추가가 필수</span>
          친구 추가 없이는<br>뉴스를 받을 수 없습니다.
          <span class="notice-sub">아래 버튼을 눌러 지금 바로 추가해주세요.</span>
        </div>
        <a class="kakao-link" id="subKakaoLink" href="https://pf.kakao.com/_lpxkCX/friend" target="_blank" rel="noopener">카카오톡 채널 친구 추가하기</a>
      </div>
    </form>
  </div>
</main>

<script>
(function(){
  const SUPABASE_URL = 'https://ytvcgoldauysvnqckzze.supabase.co';
  const BRIEFICK_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_BRlDRwvdanR1sLX2b_Iagg_AtLA8Wyf';
  const PORTONE_STORE_ID = 'store-94ded677-c4c2-45a7-adc2-eb735d601a52';
  const PORTONE_CHANNEL_KEY = 'channel-key-e32b9dbf-38c1-43a0-a080-1e208f22ab40';
  const PENDING_KEY = 'briefickRenewPendingPayment';

  // 가격 플랜 — 메인 모달(index.html PRICE_PLANS) 및 서버(payment-confirm)와 동기화 필수.
  const PRICE_PLANS = {
    '1m':  { months:1,  amount:100,   testAmount:100, label:'1개월',  orderName:'브리픽 1개월 재구독' },
    '6m':  { months:6,  amount:13800, testAmount:100, label:'6개월',  orderName:'브리픽 6개월 재구독 (할인가)' },
    '12m': { months:12, amount:22800, testAmount:100, label:'12개월', orderName:'브리픽 12개월 재구독 (할인가)' },
  };
  const TEST_MODE = false;
  function planAmount(key){ const p=PRICE_PLANS[key]||PRICE_PLANS['1m']; return TEST_MODE?p.testAmount:p.amount; }
  function getSelectedPlan(){
    const r=document.querySelector('input[name="plan"]:checked');
    return r?r.value:'1m';
  }
  function submitLabelFor(planKey, mode){
    const p=PRICE_PLANS[planKey]||PRICE_PLANS['1m'];
    const won=p.amount.toLocaleString('ko-KR')+'원';
    if(mode==='extend') return `${p.label} ${won} 연장 결제하기`;
    return `${won} 결제하기`;
  }

  const card = document.getElementById('card');
  const form = document.getElementById('subscribeForm');
  const phoneEl = document.getElementById('subPhone');
  const consent = document.getElementById('subConsent');
  const submit = document.getElementById('subSubmit');
  const cancel = document.getElementById('subCancel');
  const confirmBox = document.getElementById('subConfirm');
  const status = document.getElementById('subStatus');

  function fmtPhone(p){return p.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3')}
  function showConfirmBox(label,num,note){
    confirmBox.innerHTML = '<span class="confirm-label">'+label+'</span>'+
      '<span class="confirm-num">'+num+'</span>'+
      '<span class="confirm-note">'+note+'</span>';
    confirmBox.classList.add('show');
  }
  function hideConfirmBox(){ confirmBox.classList.remove('show'); confirmBox.innerHTML=''; }
  function resetStatus(){ status.className='status'; status.textContent=''; }
  function showStatus(type,msg){ status.className='status show '+type; status.textContent=msg; }

  function syncPlanSelectedClass(){
    const sel=getSelectedPlan();
    document.querySelectorAll('.plan').forEach(el=>{
      el.classList.toggle('selected', el.getAttribute('data-plan')===sel);
    });
  }
  function setPlanInputsDisabled(disabled){
    document.querySelectorAll('input[name="plan"]').forEach(el=>{ el.disabled=disabled });
    document.querySelectorAll('.plan').forEach(el=>{
      el.style.pointerEvents=disabled?'none':'';
      el.style.opacity=disabled?'0.6':'';
    });
  }

  // 상태: null | 'number' | 'extend'
  let confirmState = null;

  function resetToInput(){
    confirmState=null;
    submit.disabled=false;
    submit.textContent=submitLabelFor(getSelectedPlan(), null);
    cancel.classList.remove('show');
    setPlanInputsDisabled(false);
    hideConfirmBox();
    document.getElementById('subCompleteNotice').classList.remove('show');
    document.getElementById('subKakaoLink').classList.remove('emphasis');
    card.classList.remove('completed');
    card.classList.remove('processing');
    phoneEl.disabled=false;
    consent.disabled=false;
    resetStatus();
  }
  cancel.addEventListener('click',()=>{
    phoneEl.disabled=false;
    consent.disabled=false;
    resetToInput();
  });

  // 플랜 선택 — 라디오 change 시 .selected 클래스 동기화 + submit 라벨 갱신
  document.querySelectorAll('input[name="plan"]').forEach(r=>{
    r.addEventListener('change',()=>{
      syncPlanSelectedClass();
      if(confirmState===null){ submit.textContent=submitLabelFor(getSelectedPlan(), null) }
    });
  });
  syncPlanSelectedClass();

  function markComplete(j){
    const msgMap={ registered:'재구독 완료!', extended:'구독 연장 완료!' };
    const mainMsg = msgMap[j.status] || '완료!';
    const untilHtml = j.paid_until ? '<br><span class="until-date">('+j.paid_until.slice(0,10)+' 까지)</span>' : '';
    status.className='status show success';
    status.innerHTML = mainMsg + untilHtml;
    document.getElementById('subCompleteNotice').classList.add('show');
    document.getElementById('subKakaoLink').classList.add('emphasis');
    card.classList.remove('processing');
    card.classList.add('completed');
    phoneEl.disabled=true;
    consent.disabled=true;
    submit.disabled=true;submit.textContent='구독 완료됨';
    cancel.classList.remove('show');
  }

  // 포트원 모바일 REDIRECTION 복귀 처리
  async function handlePortoneReturn(){
    const params = new URLSearchParams(location.search);
    const paymentId = params.get('paymentId');
    if(!paymentId) return false;
    history.replaceState(null, '', location.pathname);
    let pending = null;
    try{ pending = JSON.parse(sessionStorage.getItem(PENDING_KEY) || 'null'); }catch(_e){}
    if(!pending || pending.paymentId !== paymentId) return false;
    sessionStorage.removeItem(PENDING_KEY);

    // 결제창 거쳐온 값 복원 (placeholder만 보이는 어색함 방지)
    phoneEl.value = pending.phone || '';
    consent.checked = true;
    phoneEl.disabled = true;
    consent.disabled = true;
    submit.disabled = true;
    cancel.classList.remove('show');
    const code = params.get('code');
    if(code){
      showStatus('error','결제 실패: '+(params.get('message')||code));
      phoneEl.disabled=false; consent.disabled=false;
      submit.disabled=false; submit.textContent=submitLabelFor(pending.plan||'1m','number');
      return true;
    }
    status.className='status show info';
    status.textContent='결제 처리 중…';
    card.classList.add('processing');
    submit.style.display='none';
    try{
      const res = await fetch(SUPABASE_URL+'/functions/v1/payment-confirm',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+BRIEFICK_SUPABASE_PUBLISHABLE_KEY,'apikey':BRIEFICK_SUPABASE_PUBLISHABLE_KEY},
        body:JSON.stringify({paymentId,phone:pending.phone,ad_consent:true,plan:pending.plan||'1m',expected_amount:planAmount(pending.plan||'1m')}),
      });
      const j = await res.json();
      if(!res.ok||!j.ok){
        card.classList.remove('processing');
        showStatus('error', j.error||'결제 검증 오류');
        phoneEl.disabled=false; consent.disabled=false;
        submit.style.display=''; submit.disabled=false; submit.textContent=submitLabelFor(pending.plan||'1m','number');
      }else{
        markComplete(j);
      }
    }catch(err){
      card.classList.remove('processing');
      showStatus('error','네트워크 오류: '+err.message);
      phoneEl.disabled=false; consent.disabled=false;
      submit.style.display=''; submit.disabled=false; submit.textContent=submitLabelFor(pending.plan||'1m','number');
    }
    return true;
  }
  handlePortoneReturn();

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    resetStatus();
    const phone = phoneEl.value.replace(/[^0-9]/g,'');
    if(!/^01[016789]\d{7,8}$/.test(phone)){
      showStatus('error','전화번호 형식이 올바르지 않습니다.');
      phoneEl.focus();return;
    }
    if(!consent.checked){
      showStatus('error','광고 수신 동의가 필요합니다.');
      consent.focus();return;
    }
    if(typeof PortOne==='undefined'){
      showStatus('error','결제 SDK 로드 실패. 새로고침 후 다시 시도해주세요.');return;
    }

    // 1단계: 구독 상태 조회 후 확인 단계로 전환
    if(confirmState===null){
      submit.disabled=true;submit.textContent='기존 구독 확인 중…';
      const planKey=getSelectedPlan();
      const planMonths=PRICE_PLANS[planKey].months;
      let isActive=false, paidUntilStr='', extStr='', daysLeft=0;
      try{
        const checkRes = await fetch(SUPABASE_URL+'/functions/v1/check-subscription',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+BRIEFICK_SUPABASE_PUBLISHABLE_KEY,'apikey':BRIEFICK_SUPABASE_PUBLISHABLE_KEY},
          body:JSON.stringify({phone}),
        });
        const chk = await checkRes.json();
        if(checkRes.ok && chk.ok && chk.subscription_active && chk.paid_until){
          isActive=true;
          const until = new Date(chk.paid_until);
          const now = new Date();
          daysLeft = Math.max(0, Math.ceil((until - now) / 86400000));
          const extended = new Date(until);
          extended.setMonth(extended.getMonth() + planMonths);
          paidUntilStr = until.toISOString().slice(0,10);
          extStr = extended.toISOString().slice(0,10);
        }
      }catch(_e){}

      if(isActive){
        const planLabel=PRICE_PLANS[planKey].label;
        const extHtml=
          '<div class="confirm-ext">'+
            '<div><span>현재 만료</span><b>'+paidUntilStr+'</b></div>'+
            '<div><span>'+planLabel+' 결제 시</span><b>'+extStr+'</b></div>'+
          '</div>';
        showConfirmBox('이 번호로 발송', fmtPhone(phone), extHtml);
        submit.textContent=submitLabelFor(planKey,'extend');
        confirmState='extend';
      }else{
        showConfirmBox('이 번호로 매일 오전 8시 발송', fmtPhone(phone), '번호가 맞으신가요?');
        submit.textContent=submitLabelFor(planKey,'number');
        confirmState='number';
      }
      phoneEl.disabled=true;
      consent.disabled=true;
      setPlanInputsDisabled(true);
      submit.disabled=false;
      cancel.classList.add('show');
      // 2단계 진입 — confirm 박스·결제 버튼 viewport에 들어오도록 페이지 끝까지 스크롤
      requestAnimationFrame(()=>{
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      });
      return;
    }

    const planKey=getSelectedPlan();
    const plan=PRICE_PLANS[planKey];
    const amount=planAmount(planKey);
    const paymentId = 'briefick'+Date.now()+Math.random().toString(36).slice(2,8);
    submit.disabled=true;submit.textContent='결제창 여는 중…';
    let completed=false;
    try{ sessionStorage.setItem(PENDING_KEY, JSON.stringify({ phone, paymentId, plan: planKey })); }catch(_e){}
    try{
      const pay = await PortOne.requestPayment({
        storeId: PORTONE_STORE_ID,
        channelKey: PORTONE_CHANNEL_KEY,
        paymentId,
        orderName: plan.orderName + (TEST_MODE ? ' (테스트)' : ''),
        totalAmount: amount,
        currency: 'KRW',
        payMethod: 'CARD',
        customer: { customerId: phone, phoneNumber: phone },
        windowType: { pc: 'IFRAME', mobile: 'REDIRECTION' },
        redirectUrl: location.origin + location.pathname,
        bypass: { galaxia: { ITEM_CODE: 'BRIEFICK_'+planKey.toUpperCase() } },
      });
      if(pay.code){
        showStatus('error','결제 실패: '+(pay.message||pay.code));
        return;
      }
      status.className='status show info';
      status.textContent='결제 처리 중…';
      card.classList.add('processing');
      const res = await fetch(SUPABASE_URL+'/functions/v1/payment-confirm',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+BRIEFICK_SUPABASE_PUBLISHABLE_KEY,'apikey':BRIEFICK_SUPABASE_PUBLISHABLE_KEY},
        body:JSON.stringify({paymentId,phone,ad_consent:true,plan:planKey,expected_amount:amount}),
      });
      const j = await res.json();
      if(!res.ok||!j.ok){
        card.classList.remove('processing');
        showStatus('error', j.error||'결제 검증 중 오류가 발생했습니다.');
      }else{
        markComplete(j);
        completed=true;
      }
    }catch(err){
      card.classList.remove('processing');
      showStatus('error','오류: '+err.message);
    }finally{
      if(!completed){submit.disabled=false;submit.textContent=submitLabelFor(planKey,confirmState||null)}
    }
  });
})();
</script>
</body>
</html>
