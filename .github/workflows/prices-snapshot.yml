name: Prices Snapshot

# 사내 시세 피드를 레포 안 data/prices-snapshot.json 으로 커밋한다.
# 왜: 자동 갱신 원격 sandbox 는 proxy 가 Supabase(피드 호스트)를 차단해 시세에 못 닿는다.
# 그래서 프리마켓(07시) 갱신 때 KR 등락률을 창작하는 사고가 반복됨(2026-07-14·07-20).
# GitHub Actions runner 는 피드에 닿으므로, 여기서 떠서 git 에 박으면 sandbox 가 그 파일을
# 읽어 "실제 마지막 종가"를 그대로 쓴다. → db-sync 와 동일한 "runner 가 대신 fetch" 패턴.
#
# 크론 2개:
# ① 21:00 UTC = 06:00 KST (Sun–Thu) — US 장 마감(20:00 UTC = 05:00 KST) 직후.
#    07:15 KST 자동 갱신이 이 스냅샷으로 전날 예측(KR·US 모두)을 채점한다.
# ② 06:45 UTC = 15:45 KST (Mon–Fri) — KR 장 마감(15:30 KST) 직후.
#    19:00 KST 자동 갱신·당일 KR 데이터 서술 소스.
# 휴장일 실행돼도 무해(피드=직전 종가).

on:
  schedule:
    - cron: '0 21 * * 0-4'   # 21:00 UTC = 06:00 KST, Sun–Thu (US 마감 직후)
    - cron: '45 6 * * 1-5'   # 06:45 UTC = 15:45 KST, Mon–Fri (KR 마감 직후)
  workflow_dispatch:

concurrency:
  group: prices-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 시세 스냅샷 생성
        run: node scripts/snapshot-prices.js

      - name: 변경 시 커밋·푸시
        run: |
          if git diff --quiet -- data/prices-snapshot.json; then
            echo "[prices-snapshot] 변경 없음 — 커밋 skip"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices-snapshot.json
          git commit -m "시세 스냅샷 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push origin HEAD:main
