name: Archive Rotate

# main update.js 변경 시 트리거 — 30일 cutoff archive 갱신.
# main에서 byte 한도(40KB)로 잘려나간 entries를 모달 mentions에서 계속 보이게 하기 위한 인프라.
# sandbox(push_files API)는 ~50KB 한계라 archive를 직접 못 만짐 → GH Actions가 일반 git push로 갱신.
#
# paths: main 5탭만 명시 (archive 파일 자체 변경엔 안 발화 — 무한 루프 방지).

on:
  push:
    branches: [main]
    paths:
      - 'data/stocks-update.js'
      - 'data/kr-stocks-update.js'
      - 'data/ai-update.js'
      - 'data/unicorn-update.js'
      - 'data/commodity-update.js'
  workflow_dispatch:

concurrency:
  group: archive-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rotate archives
        run: node scripts/rotate-archive.js

      - name: Verify archive syntax
        run: |
          for f in data/*-update-archive.js; do
            node -e "const fs=require('fs');const src=fs.readFileSync('$f','utf8');new Function(src+';return updatesArchive;')()" \
              || { echo "::error::Syntax error in $f"; exit 1; }
          done
          echo "✓ 5 archive files syntax OK"

      - name: Commit and push
        run: |
          git config user.email "rookiejj@gmail.com"
          git config user.name "Archive Bot"
          git add data/*-update-archive.js
          if git diff --cached --quiet; then
            echo "[skip] archive 변경 없음"
            exit 0
          fi
          git commit -m "archive 자동 갱신 (30일 cutoff)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "::warning::push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "::error::git push 3회 실패"
          exit 1
