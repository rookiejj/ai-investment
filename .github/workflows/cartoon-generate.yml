name: Cartoon Generate

# 데이터(헤드라인) 갱신 푸시 시 1컷 만화 자동 재생성·Supabase Storage 업로드.
# 자동 갱신 커밋(데이터 자동 갱신/데이터 정합성 강제 갱신)에서만 실행 — 사람 수동 편집은 skip.

on:
  push:
    branches: [main]
    paths:
      - 'data/*-update.js'
  workflow_dispatch:
    inputs:
      index:
        description: '몇 번째 entry 사용 (0=최신)'
        required: false
        default: '0'

concurrency:
  group: cartoon-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger gating (push only)
        if: github.event_name == 'push'
        id: gate
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "commit message: $MSG"
          if [[ "$MSG" == 데이터\ 자동\ 갱신* ]] || [[ "$MSG" == 데이터\ 정합성\ 강제\ 갱신* ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "사람 수동 편집 커밋 — cartoon 생성 skip"
          fi

      - name: Skip if not auto-update
        if: github.event_name == 'push' && steps.gate.outputs.should_run != 'true'
        run: |
          echo "::notice::trigger gating fail — cartoon 생성 skip"
          exit 0

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate cartoon and upload
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIEFICK_SUPABASE_SECRET_KEY: ${{ secrets.BRIEFICK_SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://ytvcgoldauysvnqckzze.supabase.co
        run: |
          node scripts/cartoon/generate.js \
            --index ${{ inputs.index || '0' }} \
            --upload \
            --no-open
