name: Cartoon Generate

# 자동 갱신 sandbox의 마커 commit push 시 신문 1면 PNG 자동 재생성·Supabase Storage 업로드.
# 사람이 .cartoon-marker를 안 만지는 한 발화 안 됨 — 컨트롤 단순화.
#
# 5/14 newspaper 1면 PNG로 교체: Playwright HTML→PNG 렌더 (비용 0).
# 이전 Gemini nano-banana-pro 카툰(~$0.13/장 × 2회/일)은 폐기 — 디자인 임팩트 vs 비용 트레이드오프.
# Storage 파일은 cartoon/today.png 그대로 — 홈피·인스타 캐러셀·인스타 Reels·OG 모두 같은 URL.

on:
  # 마커 commit 트리거 — 자동 갱신 sandbox가 모든 데이터 push 완료 후 마지막 단계로
  # data/.cartoon-marker 파일에 epoch timestamp를 박은 별도 commit을 push한다.
  # 이 마커 push가 곧 "데이터 갱신 완료" 시그널 → 카툰 발화. mid-state 위험 0
  # (마커는 항상 맨 마지막 commit), schedule 등록 지연 0, 시간 buffer 추정 0.
  # 이전(5/10) schedule cron 방식은 GitHub 측 schedule 등록 지연으로 첫 슬롯(5/11 08:00)
  # 미발화 회귀 발생 — 데이터 갱신 완료 시그널을 직접 받는 구조로 회귀.
  push:
    branches: [main]
    paths:
      - 'data/.cartoon-marker'
  workflow_dispatch:
    inputs:
      index:
        description: '몇 번째 entry 사용 (0=최신)'
        required: false
        default: '0'

concurrency:
  group: cartoon-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 시작 알림
        run: |
          curl -s -o /dev/null -X POST \
            "https://ytvcgoldauysvnqckzze.supabase.co/functions/v1/notify-telegram" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"source":"Cartoon Generate","status":"start"}' || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Generate newspaper PNG
        env:
          BRIEFICK_SUPABASE_SECRET_KEY: ${{ secrets.BRIEFICK_SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://ytvcgoldauysvnqckzze.supabase.co
        run: node scripts/cartoon/generate.js --upload

      - name: 종료 알림 (항상 실행)
        if: always()
        run: |
          case "${{ job.status }}" in
            success) STATUS="success" ;;
            failure) STATUS="failure" ;;
            cancelled) STATUS="failure" ;;
            *) STATUS="unknown" ;;
          esac
          curl -s -o /dev/null -X POST \
            "https://ytvcgoldauysvnqckzze.supabase.co/functions/v1/notify-telegram" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"Cartoon Generate\",\"status\":\"$STATUS\"}" || true
