name: Cartoon Generate

# 자동 갱신 sandbox의 마커 commit push 시 1컷 만화 자동 재생성·Supabase Storage 업로드.
# 사람이 .cartoon-marker를 안 만지는 한 발화 안 됨 — 컨트롤 단순화.
#
# 화풍·파일 단일화 (5/11): 1950s 뉴스 화풍 하나로 통일, Storage 파일도 today.png 단일.
# 홈피·인스타 캐러셀·인스타 Reels 모두 같은 today.png를 소스로 씀. Gemini 단가 ~$0.13/장.

on:
  # 마커 commit 트리거 — 자동 갱신 sandbox가 모든 데이터 push 완료 후 마지막 단계로
  # data/.cartoon-marker 파일에 epoch timestamp를 박은 별도 commit을 push한다.
  # 이 마커 push가 곧 "데이터 갱신 완료" 시그널 → 카툰 발화. mid-state 위험 0
  # (마커는 항상 맨 마지막 commit), schedule 등록 지연 0, 시간 buffer 추정 0.
  # 이전(5/10) schedule cron 방식은 GitHub 측 schedule 등록 지연으로 첫 슬롯(5/11 08:00)
  # 미발화 회귀 발생 — 데이터 갱신 완료 시그널을 직접 받는 구조로 회귀.
  push:
    branches: [main]
    paths:
      - 'data/.cartoon-marker'
  workflow_dispatch:
    inputs:
      index:
        description: '몇 번째 entry 사용 (0=최신)'
        required: false
        default: '0'

concurrency:
  group: cartoon-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate cartoon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Nano Banana Pro($0.13/장) — Gemini 2.5 Flash Image($0.04/장) 다운그레이드 시도했으나
          # 한국어 자모 hallucination("오늘"→"오들" 등)으로 워터마크·말풍선 깨짐. 품질 우선 복귀.
          GEMINI_IMAGE_MODEL: nano-banana-pro-preview
          BRIEFICK_SUPABASE_SECRET_KEY: ${{ secrets.BRIEFICK_SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://ytvcgoldauysvnqckzze.supabase.co
        run: |
          node scripts/cartoon/generate.js \
            --style 1950s \
            --index ${{ inputs.index || '0' }} \
            --upload \
            --no-open
