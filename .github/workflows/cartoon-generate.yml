name: Cartoon Generate

# 데이터(헤드라인) 갱신 푸시 시 1컷 만화 자동 재생성·Supabase Storage 업로드.
# 자동 갱신 커밋(데이터 자동 갱신/데이터 정합성 강제 갱신)에서만 실행 — 사람 수동 편집은 skip.
#
# 화풍 분기 (KST 시간대):
#   - 00:00 ~ 11:59 → 1950s 뉴스 화풍 (today-news.png) — 홈 + 인스타 캐러셀에서 사용
#   - 12:00 ~ 23:59 → Mad Magazine 화풍 (today-magazine.png) — 홈 + 인스타 Reels에서 사용
# 매 실행 1장만 생성 (이전엔 매번 두 장 → Gemini 단가 절감 위해 시간대별 1장으로 축소)

on:
  # data/version.js 갱신을 트리거 시그널로 사용 (마커 방식).
  # 트리거 sandbox가 *-update.js를 분할 commit push할 때 첫 commit엔 일부 update.js만 들어
  # 있어 그 시점에 카툰 그리면 mixed-date가 되는 문제 차단. version.js는 모든 데이터·update.js
  # batch가 push된 후 마지막에 푸시되도록 트리거 prompt에 명시 — 이때만 카툰 발동.
  # 매뉴얼 편집 시 version.js를 의도적으로 안 건드리면 카툰 트리거 안 됨 (제어 가능).
  push:
    branches: [main]
    paths:
      - 'data/version.js'
  workflow_dispatch:
    inputs:
      index:
        description: '몇 번째 entry 사용 (0=최신)'
        required: false
        default: '0'
      style:
        description: '강제 화풍 (자동=KST 시간대 기반 / 1950s / mad-mag)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1950s'
          - 'mad-mag'

concurrency:
  group: cartoon-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger gating (push only)
        if: github.event_name == 'push'
        id: gate
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "commit message: $MSG"
          if [[ "$MSG" == 데이터\ 자동\ 갱신* ]] || [[ "$MSG" == 데이터\ 정합성\ 강제\ 갱신* ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "사람 수동 편집 커밋 — cartoon 생성 skip"
          fi

      - name: Skip if not auto-update
        if: github.event_name == 'push' && steps.gate.outputs.should_run != 'true'
        run: |
          echo "::notice::trigger gating fail — cartoon 생성 skip"
          exit 0

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # KST 시간대 기반 화풍 결정. workflow_dispatch에서 style 입력했으면 그대로 사용.
      - name: Determine cartoon style
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_run == 'true'
        id: style
        run: |
          INPUT_STYLE='${{ inputs.style }}'
          if [ "$INPUT_STYLE" = "1950s" ] || [ "$INPUT_STYLE" = "mad-mag" ]; then
            STYLE="$INPUT_STYLE"
            echo "style=$STYLE (수동 입력)"
          else
            KST_HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$KST_HOUR" -lt 12 ]; then
              STYLE="1950s"
              echo "KST ${KST_HOUR}시 (오전) → 1950s 뉴스 화풍 → today-news.png"
            else
              STYLE="mad-mag"
              echo "KST ${KST_HOUR}시 (오후) → Mad Magazine 화풍 → today-magazine.png"
            fi
          fi
          echo "style=$STYLE" >> $GITHUB_OUTPUT

      - name: Generate cartoon
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Nano Banana Pro($0.13/장) — Gemini 2.5 Flash Image($0.04/장) 다운그레이드 시도했으나
          # 한국어 자모 hallucination("오늘"→"오들" 등)으로 워터마크·말풍선 깨짐. 품질 우선 복귀.
          # KST 시간대 분기로 매 실행 1장만 생성 — 일일 ~$0.26 수준.
          GEMINI_IMAGE_MODEL: nano-banana-pro-preview
          BRIEFICK_SUPABASE_SECRET_KEY: ${{ secrets.BRIEFICK_SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://ytvcgoldauysvnqckzze.supabase.co
        run: |
          node scripts/cartoon/generate.js \
            --style ${{ steps.style.outputs.style }} \
            --index ${{ inputs.index || '0' }} \
            --upload \
            --no-open
