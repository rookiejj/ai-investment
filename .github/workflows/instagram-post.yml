name: Instagram Post

# Cartoon Generate 워크플로 완료 후 트리거 — cartoon-generate가 today.png 단일 카툰을
# Supabase에 올린 직후에 모드별로 분기 게시.
#
# 5/11 단일화: 화풍·소스 파일 통일(1950s + today.png). 캐러셀/Reels는 발행 포맷만 다르고
# 소스 슬라이드 구성은 동일(카툰 + 5탭 불릿 + CTA = 7장). 모드 분기 (KST):
#   - 05~12시: 캐러셀 — 7장 슬라이드(IG_SLIDES로 선택)
#   - 13~23시: Reels — 같은 7장을 9:16 mp4로 슬라이드쇼 (~42초, BGM 합성)
#   - 00~04시: all (예외 케이스, 운영자 수동 push 대비)

on:
  workflow_run:
    workflows: ["Cartoon Generate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: '발행 모드 (all=캐러셀+Reels / carousel=캐러셀만 / reels=Reels만)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'carousel'
          - 'reels'
      dry_run:
        description: '연습 모드 (true=게시 안 함, 슬라이드만 만들고 캡션 출력)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: instagram-post
  cancel-in-progress: false

# 2026-06 이후 Node 20 액션이 강제 deprecate 되므로 미리 Node 24로.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    # cartoon-generate가 schedule(KST 08·20시)로 발동되어 success 완료한 경우 chain.
    # 시간 트리거 단일화 후 push commit 메시지·JP 필터·60분 쿨다운 모두 불필요해 제거.
    # workflow_dispatch는 운영자 수동 호출로 항상 통과.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 50
    steps:
      - name: 시작 알림
        run: |
          MODE_HINT=$(TZ=Asia/Seoul date '+%H' | awk '{h=$1+0; if(h>=5 && h<=12) print "carousel"; else if(h>=13 && h<=23) print "reels"; else print "all"}')
          curl -s -o /dev/null -X POST \
            "https://ytvcgoldauysvnqckzze.supabase.co/functions/v1/notify-telegram" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"Instagram Post\",\"status\":\"start\",\"detail\":\"mode=$MODE_HINT\"}" || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: 발행 모드 결정 (KST 시간대 기반)
        id: mode
        run: |
          # workflow_dispatch는 사용자 지정 mode 그대로.
          # workflow_run은 KST 시간대 분기:
          #   05~12시 → carousel (오전)
          #   13~23시 → reels (오후)
          #   00~04시 → all (예외)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode || 'all' }}"
            echo "workflow_dispatch — 사용자 지정 mode=$MODE"
          else
            HOUR=$(TZ=Asia/Seoul date '+%H')
            if [ "$HOUR" -ge 5 ] && [ "$HOUR" -le 12 ]; then
              MODE="carousel"
            elif [ "$HOUR" -ge 13 ] && [ "$HOUR" -le 23 ]; then
              MODE="reels"
            else
              MODE="all"
            fi
            echo "workflow_run — KST ${HOUR}시 → mode=$MODE"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg는 johnvansickle CDN의 static binary로 받는다 — Azure apt 미러 의존 0.
      # 5/8에 5→2분 timeout으로 줄였으나 미러 hang이 2분 넘는 케이스로 5/12 두 슬롯 연속
      # 발행 fail. apt 의존 제거로 근본 해결. 폰트는 apt 유지(없어도 영상 자체는 됨).
      - name: ffmpeg static binary 다운로드
        timeout-minutes: 2
        run: |
          set -e
          curl -L --retry 3 --max-time 60 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/
          sudo mv /tmp/ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/ffmpeg
          sudo mv /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      # 한글 폰트도 apt 의존 제거 — Google Noto GitHub release에서 직접 다운로드.
      # 폰트 fail 시 Playwright 슬라이드 렌더에서 한글이 □□□로 깨진 채 인스타에 올라가는
      # 더 큰 사고 발생. apt 의존 0 + continue-on-error 제거로 발행 안정성·정합성 둘 다.
      - name: Noto CJK + Color Emoji 폰트 다운로드
        timeout-minutes: 3
        run: |
          set -e
          mkdir -p ~/.fonts
          # Noto Sans CJK (한·중·일 통합, ~20MB) — Sans-Bold·Sans-Regular 두 weight
          curl -L --retry 3 --max-time 90 \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC/NotoSansCJK-Regular.ttc \
            -o ~/.fonts/NotoSansCJK-Regular.ttc
          curl -L --retry 3 --max-time 90 \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC/NotoSansCJK-Bold.ttc \
            -o ~/.fonts/NotoSansCJK-Bold.ttc
          # Noto Color Emoji
          curl -L --retry 3 --max-time 60 \
            https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf \
            -o ~/.fonts/NotoColorEmoji.ttf
          fc-cache -fv
          fc-list :lang=ko | head -3

      - name: npm 의존성 설치
        run: npm install --no-audit --no-fund

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      # render-slides.js는 두 모드 모두에서 실행. 이유:
      #   - 캐러셀: 07.png(CTA) 필요 + meta.json
      #   - Reels: meta.json만 필요 (publish.js의 buildCaption이 참조)
      # render-slides는 7장 만들지만 Reels 모드에선 01~06.png는 사용 안 함.
      # 한 가지 흐름으로 유지하는 단순함이 ~30s 추가 비용보다 가치 있음.
      - name: 슬라이드·meta.json 렌더
        run: node scripts/instagram/render-slides.js

      # 오늘의 카툰 다운로드 — cartoon-generate가 업로드한 today.png(1080×1350 4:5) 사용.
      # 홈페이지·캐러셀·Reels가 같은 1장을 공유 → 시각 일관성.
      # 신선도 체크: 1시간 이상 stale 또는 다운로드 실패 시 즉석 생성으로 폴백 (Supabase에도 갱신).
      # 자동 흐름(cartoon-generate 직후 instagram-post 발사)에선 파일 나이 ~5분이라 항상 통과.
      - name: 오늘의 카툰 다운로드 (캐러셀·Reels 공용 소스)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: nano-banana-pro-preview
          BRIEFICK_SUPABASE_SECRET_KEY: ${{ secrets.BRIEFICK_SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://ytvcgoldauysvnqckzze.supabase.co
        run: |
          STAMP=$(date +%s)
          CARTOON_URL="https://ytvcgoldauysvnqckzze.supabase.co/storage/v1/object/public/cartoon/today.png?t=$STAMP"
          OUT=scripts/instagram/out/cartoon.png
          THRESHOLD=3600

          LAST_MOD=$(curl -sI "$CARTOON_URL" | awk -F': ' 'tolower($1)=="last-modified"{print $2}' | tr -d '\r\n')
          if [ -n "$LAST_MOD" ]; then
            LAST_MOD_TS=$(date -d "$LAST_MOD" +%s 2>/dev/null || echo 0)
            AGE=$(( $(date +%s) - LAST_MOD_TS ))
          else
            AGE=999999
          fi
          echo "[storage] today.png age=${AGE}s threshold=${THRESHOLD}s"

          if [ "$AGE" -lt "$THRESHOLD" ] && curl -fsSL "$CARTOON_URL" -o "$OUT" && [ -s "$OUT" ]; then
            echo "[download] today.png 사용 (fresh)"
          else
            echo "::warning::today.png stale/누락 (age=${AGE}s) — 즉석 생성 + Supabase 동기화"
            # --upload로 today.png에 동시 업로드 — 홈피·인스타 어긋남 방지.
            node scripts/cartoon/generate.js \
              --style 1950s \
              --no-open \
              --upload \
              --output "$OUT"
          fi
          ls -la "$OUT"

      # Reels 렌더 — 캐러셀과 동일 7장(카툰 + 5탭 + CTA)을 9:16 mp4로.
      # render-reels.js는 01.png~07.png를 디폴트로 받으므로 cartoon.png를 01.png 자리에
      # 박아 텍스트 표지(render-slides가 만든 원래 01.png)를 카툰으로 대체.
      # SLIDE_SEC=6 × 7장 ≈ 42초 - crossfade. BGM은 music/track.mp3 있으면 자동 합성.
      - name: Reels 렌더 (7장 슬라이드쇼 9:16)
        if: (steps.mode.outputs.mode == 'reels' || steps.mode.outputs.mode == 'all')
        run: |
          cp scripts/instagram/out/cartoon.png scripts/instagram/out/01.png
          node scripts/instagram/render-reels.js

      - name: 출력물 아티팩트 업로드 (디버깅용, 7일 보관)
        uses: actions/upload-artifact@v4
        with:
          name: instagram-output
          path: scripts/instagram/out/
          retention-days: 7

      - name: 인스타그램 게시
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_BUSINESS_USER_ID: ${{ secrets.IG_BUSINESS_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BRIEFICK_SUPABASE_SECRET_KEY: ${{ secrets.BRIEFICK_SUPABASE_SECRET_KEY }}
          IG_CAROUSEL_BUCKET: ${{ secrets.IG_CAROUSEL_BUCKET }}
          IG_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          IG_MODE: ${{ steps.mode.outputs.mode }}
          # 캐러셀 슬라이드 = 카툰(표지) + 5탭 불릿(02~06) + CTA(07) = 7장. Reels 모드에선 무시됨.
          # render-slides.js는 01.png(텍스트 표지)도 만들지만 카툰이 표지 역할이라 02부터 사용.
          IG_SLIDES: cartoon.png,02.png,03.png,04.png,05.png,06.png,07.png
        run: node scripts/instagram/publish.js

      - name: 종료 알림 (항상 실행)
        if: always()
        run: |
          case "${{ job.status }}" in
            success) STATUS="success" ;;
            failure) STATUS="failure" ;;
            cancelled) STATUS="failure" ;;
            *) STATUS="unknown" ;;
          esac
          MODE="${{ steps.mode.outputs.mode || 'unknown' }}"
          curl -s -o /dev/null -X POST \
            "https://ytvcgoldauysvnqckzze.supabase.co/functions/v1/notify-telegram" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"Instagram Post\",\"status\":\"$STATUS\",\"detail\":\"mode=$MODE\"}" || true
