name: Daily SEO Build

# 사이클 완료 신호(.cartoon-marker push)에 발화. cartoon-generate.yml 과 같은 트리거.
# /daily/YYYY-MM-DD.html + /daily/index.html + /sitemap.xml + /news-sitemap.xml + /rss.xml + /robots.txt
#
# 이전(5/20~5/21): 5탭 *-update.js 매번 발화 — 사이클당 5회 발화하면서 sandbox push 와
# main 에 commit 끼어들기·rebase 압력 누적. 5/21 PM 사이클 중단 사고 후 마커 단일 트리거로 정렬.
# sandbox 가 모든 탭 push 완료 후 마지막에 마커 push → cartoon-generate·daily-seo 둘 다
# 그 시점에 1회 발화. 사이클 중엔 외부 워크플로 commit 0건 → race condition 0.
#
# dev 가 company-ko.js·build-daily-page.js 변경 시는 즉시 rebuild 필요해 별도 paths 로 유지.

on:
  push:
    branches: [main]
    paths:
      - 'data/.cartoon-marker'         # 자동 갱신 사이클 완료 신호 (5탭 모두 push 끝난 뒤)
      - 'data/company-ko.js'           # 한글 매핑 dev 변경 시 즉시 rebuild
      - 'scripts/build-daily-page.js'  # 빌더 코드 dev 변경 시 즉시 rebuild
  workflow_dispatch:

concurrency:
  group: daily-seo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 시작 알림
        run: |
          curl -s -o /dev/null -X POST \
            "https://ytvcgoldauysvnqckzze.supabase.co/functions/v1/notify-telegram" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"source":"Daily SEO","status":"start"}' || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth: 0 — rebase 정확성 위해 전체 history. 트리거가 paths 매치 후
          # workflow 실행 중 main이 다른 push로 앞서 나가는 race condition 보호.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SEO 페이지·sitemap·robots 빌드
        run: node scripts/build-daily-page.js

      - name: 변경사항 커밋·푸시
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily/ sitemap.xml news-sitemap.xml rss.xml robots.txt

          if git diff --cached --quiet; then
            echo "[daily-seo] 변경사항 없음 — skip"
            exit 0
          fi

          DATE_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d')
          git commit -m "SEO 페이지 자동 빌드 ${DATE_KST}"

          # fetch + rebase + push 3회 재시도 — main이 워크플로 실행 중 앞서 나가는
          # race condition(non-fast-forward reject) 자동 복구. 우리 변경은 daily/·
          # *.xml·robots.txt만이라 다른 변경과 충돌 가능성 낮음, 충돌 시 rebase abort.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::rebase 충돌 — abort 후 재시도 ${attempt}/3"
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin main; then
              echo "[daily-seo] push 성공 (시도 ${attempt})"
              exit 0
            fi
            echo "::warning::push 실패 — 재시도 ${attempt}/3"
            sleep 3
          done
          echo "::error::3회 시도 후 push 실패"
          exit 1

      - name: 종료 알림 (항상 실행)
        if: always()
        run: |
          case "${{ job.status }}" in
            success) STATUS="success" ;;
            failure) STATUS="failure" ;;
            cancelled) STATUS="failure" ;;
            *) STATUS="unknown" ;;
          esac
          curl -s -o /dev/null -X POST \
            "https://ytvcgoldauysvnqckzze.supabase.co/functions/v1/notify-telegram" \
            -H "X-Notify-Secret: ${{ secrets.NOTIFY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"Daily SEO\",\"status\":\"$STATUS\"}" || true
