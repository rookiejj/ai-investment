<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Briefick Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdfbf4;
    --cream-deep: #f6f1e3;
    --paper: #ffffff;
    --ink: #0d0d0d;
    --green: #18E299;
    --green-deep: #0fa76e;
    --text: #0d0d0d;
    --text-mid: rgba(13,13,13,0.72);
    --text-mute: rgba(13,13,13,0.50);
    --line: rgba(13,13,13,0.10);
    --line-strong: rgba(13,13,13,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .slide {
    width: 1080px; height: 1350px;
    position: relative;
    overflow: hidden;
    padding: 80px 72px;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }
  /* 모든 텍스트 슬라이드(표지·5탭·CTA) 공통 — warm 크림 base + 우상단 녹색 글로우.
     매거진 톤. 카툰 슬라이드만 시각적 break. */
  .slide.no-photo {
    background:
      radial-gradient(ellipse at top right, rgba(24,226,153,0.18) 0%, rgba(253,251,244,0) 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--paper) 100%);
  }
  /* legacy text-on-photo — bright bg 전환 후 그림자 불필요. 클래스는 호환 위해 유지하되 효과 0. */
  .text-on-photo { text-shadow: none; }

  /* === Cover (slide 1) === */
  .cover {
    justify-content: space-between;
  }
  .cover-top { display: flex; justify-content: space-between; align-items: center; }
  .brand-mark {
    font-size: 40px; font-weight: 600; letter-spacing: -0.6px;
    color: var(--ink);
  }
  .brand-mark .dot { color: var(--green); }
  /* CTA mid의 헤드라인 시작 y와 정렬되도록 동일한 padding-top 적용 */
  .cover-mid { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 160px; gap: 28px; }
  .cover-date {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 28px; font-weight: 600;
    color: var(--green-deep);
    text-transform: uppercase; letter-spacing: 1.4px;
  }
  .cover-headline {
    font-size: 110px; font-weight: 700; line-height: 1.05;
    letter-spacing: -2.5px;
    color: var(--ink);
  }
  .cover-headline .accent { color: var(--green-deep); }
  .cover-bottom {
    display: flex; justify-content: center; align-items: flex-end;
    padding-top: 36px;
    border-top: 1px solid var(--line);
  }
  .cover-tabs {
    display: flex; gap: 14px; flex-wrap: nowrap; justify-content: center;
  }
  .cover-tab-pill {
    font-size: 29px; font-weight: 500;
    padding: 13px 23px;
    border: 1px solid var(--line-strong);
    border-radius: 9999px;
    color: var(--text-mid);
    background: rgba(13,13,13,0.04);
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }

  /* === Tab slide (2-6) === */
  .tab-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .tab-title-row { display: flex; align-items: center; gap: 18px; }
  .tab-emoji {
    font-size: 56px; line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(13,13,13,0.10));
  }
  .tab-title {
    font-size: 48px; font-weight: 700; letter-spacing: -1.0px;
    color: var(--ink);
  }
  /* 헤더 아래 가는 구분선 */
  .tab-divider {
    height: 1px;
    background: var(--line);
    margin-top: 26px;
  }
  /* 5불릿 영역 — 하단 정렬 + footer와 확실히 분리 */
  .tab-body {
    flex: 1; padding-top: 36px; padding-bottom: 96px;
    display: flex; flex-direction: column; gap: 26px;
    justify-content: flex-end;
  }
  .bullet-row {
    display: flex; align-items: flex-start; gap: 20px;
  }
  .bullet-mark {
    flex-shrink: 0;
    margin-top: 16px;
    width: 12px; height: 12px;
    border-radius: 9999px;
    background: var(--green-deep);
    box-shadow: 0 0 12px rgba(24,226,153,0.45);
  }
  .bullet-text {
    flex: 1;
    font-size: 36px; font-weight: 600; line-height: 1.42;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .bullet-text .num { color: var(--green-deep); font-weight: 700; }
  .tab-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 24px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .tab-footer-left {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 22px; font-weight: 500;
    color: var(--text-mid);
    text-transform: uppercase; letter-spacing: 1.0px;
  }
  .tab-footer-right {
    font-size: 24px; font-weight: 600;
    color: var(--text-mid);
    letter-spacing: -0.3px;
  }
  .tab-footer-right .handle { color: var(--green-deep); }

  /* === CTA (slide 7) === */
  /* .cta는 .no-photo와 동일 base 위에 우하단 글로우를 한 번 더 강조해 마무리감. */
  .cta {
    background:
      radial-gradient(ellipse at bottom right, rgba(24,226,153,0.22) 0%, rgba(253,251,244,0) 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--paper) 100%);
    color: var(--ink);
    justify-content: space-between;
  }
  .cta-top { display: flex; justify-content: space-between; align-items: center; }
  .cta-brand { font-size: 40px; font-weight: 600; letter-spacing: -0.6px; color: var(--ink); }
  .cta-brand .dot { color: var(--green); }
  /* cover-mid와 동일한 시작 y 보장 */
  .cta-mid { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 160px; gap: 36px; }
  .cta-headline {
    font-size: 92px; font-weight: 700; line-height: 1.08;
    letter-spacing: -2.0px;
    color: var(--ink);
  }
  .cta-headline .accent { color: var(--green-deep); }
  .cta-sub {
    font-size: 36px; font-weight: 600; line-height: 1.45;
    letter-spacing: -0.4px;
    color: var(--text-mid);
    max-width: 880px;
  }
  .cta-actions {
    display: flex; flex-direction: column; gap: 22px;
    margin-top: 20px;
  }
  .cta-action-row {
    display: flex; align-items: center; gap: 20px;
    font-size: 30px; font-weight: 500;
    color: rgba(13,13,13,0.92);
  }
  .cta-action-row .icon-box {
    width: 64px; height: 64px;
    border-radius: 14px;
    background: rgba(13,13,13,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
  }
  .cta-action-row .label {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 24px; color: var(--ink);
    text-transform: uppercase; letter-spacing: 0.8px;
    min-width: 130px;
  }
  .cta-action-row .value {
    color: var(--green-deep);
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- ========== SLIDE 1: COVER ========== -->
<div class="slide cover no-photo" data-slide="cover">
  <div class="cover-top">
    <div class="brand-mark">briefick<span class="dot">.</span></div>
  </div>
  <div class="cover-mid text-on-photo">
    <div class="cover-date" data-bind="cover.dateLabel">2026.04.30 · WED</div>
    <div class="cover-headline" data-bind="cover.headline">오늘의<br/><span class="accent">시장 요약</span></div>
  </div>
  <div class="cover-bottom">
    <div class="cover-tabs" data-bind="cover.tabPills">
      <div class="cover-tab-pill">🇺🇸 미국</div>
      <div class="cover-tab-pill">🇰🇷 한국</div>
      <div class="cover-tab-pill">🤖 AI</div>
      <div class="cover-tab-pill">🛢️ 원자재</div>
      <div class="cover-tab-pill">🦄 유니콘</div>
    </div>
  </div>
</div>

<!-- ========== SLIDE 2-6: TAB ========== -->
<div class="slide tab no-photo" data-slide="tab">
  <div class="tab-header text-on-photo">
    <div class="tab-title-row">
      <div class="tab-emoji" data-bind="tab.emoji">🇺🇸</div>
      <div class="tab-title" data-bind="tab.label">미국 마켓</div>
    </div>
  </div>
  <div class="tab-divider"></div>
  <div class="tab-body text-on-photo" data-bind="tab.bullets">
    <div class="bullet-row"><div class="bullet-mark"></div><div class="bullet-text">샘플 불릿 1</div></div>
    <div class="bullet-row"><div class="bullet-mark"></div><div class="bullet-text">샘플 불릿 2</div></div>
  </div>
  <div class="tab-footer">
    <div class="tab-footer-left" data-bind="tab.dateLabel">2026.04.30 KST</div>
    <div class="tab-footer-right">briefick<span class="handle">.</span></div>
  </div>
</div>

<!-- ========== SLIDE 7: CTA ========== -->
<div class="slide cta" data-slide="cta">
  <div class="cta-top">
    <div class="cta-brand">briefick<span class="dot">.</span></div>
  </div>
  <div class="cta-mid">
    <div class="cta-headline">매일 아침<br/><span class="accent">카톡으로</span><br/>받아보기</div>
    <div class="cta-sub">5개 시장의 핵심 변화만 압축해서.<br/>매일 아침 첫 커피와 함께.</div>
    <div class="cta-actions">
      <div class="cta-action-row">
        <div class="icon-box">🌐</div>
        <div class="label">Web</div>
        <div class="value" data-bind="cta.domain">briefick.com</div>
      </div>
      <div class="cta-action-row">
        <div class="icon-box">📷</div>
        <div class="label">Insta</div>
        <div class="value" data-bind="cta.handle">@briefick</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
